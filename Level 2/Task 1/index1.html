<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Attractive Responsive Grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Page Background */
    body {
      background: linear-gradient(135deg, #141e30, #243b55);
      min-height: 100vh;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Card Styling */
    .card {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .card-body {
      background-color: #ffffff;
      color: #000000;
    }

    /* Custom Purple Button */
    .btn-purple {
      background-color: #7b2cbf;
      color: #ffffff;
      border: none;
    }

    .btn-purple:hover,
    .btn-purple:focus,
    .btn-purple:active,
    .btn-purple:focus-visible {
      background-color: #7b2cbf;
      color: #ffffff;
      box-shadow: none;
    }

    /* Custom Blue Button */
    .btn-blue {
      background-color: #0077b6;
      color: #ffffff;
      border: none;
    }

    .btn-blue:hover,
    .btn-blue:focus,
    .btn-blue:active,
    .btn-blue:focus-visible {
      background-color: #0077b6;
      color: #ffffff;
      box-shadow: none;
    }

    /* Button Hover Animation (No Color Change) */
    .btn-purple,
    .btn-blue {
      transition: transform 0.3s ease;
    }

    .btn-purple:hover,
    .btn-blue:hover {
      transform: scale(1.05);
    }

    .btn-warning:hover{
        transition: transform 0.3s ease;
        transform: scale(1.05);
    }
    .btn-warning:active,
    .btn-warning:focus,
    .btn-warning:focus-visible {
        background-color: #ffffff !important;
        color: #000000 !important;
        border: none;
        box-shadow: none;
    }


  </style>
</head>
<body>

<div class="container py-5">
  <h1 class="text-center mb-5">Bootstrap Responsive Grid</h1>

        <div class="card-body">
          <h5 class="card-title">Frontend Development</h5>

          </p>
          <button class="btn btn-purple w-100"
            onclick="showMessage('Frontend Development')">
            Explore

        </div>
      </div>
    </div>
